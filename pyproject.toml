[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-movement-predictor"
version = "0.1.0"
description = "Short-horizon stock movement modeling with XGBoost and baseline models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Roy Liu"}]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "xgboost==2.0.3",
  "matplotlib==3.9.2",
  "pyarrow==17.0.0",
  "joblib==1.4.2",
]

[project.optional-dependencies]
alpaca = [
  "alpaca-trade-api==3.2.0",
]
dev = [
  "pytest==8.3.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
